<script>
  // --- APP-WIDE STATE MANAGEMENT MATRIX VARIABLES ---
  let clickedItemsTotal = 0;
  let globalAudioCtx = null;
  let activeSessionTimerIntervalId = null;
  let totalSecondsRemainingInSession = 0;
  let currentActiveColorState = "cyberpunk";
  let currentScaleStepIndex = 0;

  // --- ACCESSIBILITY TEXT SCALING COMPILATION CONFIG MAP ---
  const fontScaleStepsMap = [
    { label: "[ TEXT: 1x ]", bodySize: "11px", cardTitle: "12px", rowGap: "0.5rem 1rem" },
    { label: "[ TEXT: 1.3x ]", bodySize: "14px", cardTitle: "15px", rowGap: "0.7rem 1.2rem" },
    { label: "[ TEXT: 1.5x ]", bodySize: "16px", cardTitle: "17px", rowGap: "0.9rem 1.4rem" }
  ];

  // --- SERVICE RUNTIME REQUIREMENT RULES DATABASE ---
  const serviceProtocolDatabase = {
    "ecitizen": { time: 20, items: ["National ID Card", "Active Phone (for OTP verification)"] },
    "kra": { time: 15, items: ["KRA PIN Certificate", "Active Email Address", "Employment P9 Form (if filing)"] },
    "ntsa": { time: 25, items: ["Original Logbook Copy", "National ID Scan", "TIMS/E-Citizen Credentials"] },
    "good conduct": { time: 15, items: ["Original National ID Card", "Generated DCI Invoice Printout"] },
    "company": { time: 60, items: ["Proposed 3 Business Names", "Director ID Scans & Passport Photos", "KRA PIN Scans"] },
    "business name": { time: 30, items: ["Proposed Name", "Owner National ID Scan"] },
    "etims": { time: 40, items: ["KRA iTax Password", "Business Registration Certificate (Certificate of Incorporation)"] },
    "cv": { time: 45, items: ["Previous CV Draft / Academic Certificates", "List of Professional Referees"] },
    "resume": { time: 45, items: ["Previous CV Draft / Academic Certificates", "List of Professional Referees"] },
    "university": { time: 30, items: ["KCSE Result Slip Scan", "National ID / Birth Certificate Scan"] },
    "kuccps": { time: 20, items: ["KCSE Index Number", "Portal Password Token"] },
    "helb": { time: 35, items: ["Parent ID / Death Certificate Scan", "Guarantor ID Copies", "Smart Phone Number"] },
    "passport photo": { time: 10, items: ["Physical Presence at Rongo Hub Studio"] }
  };

  // --- CODES EXPIRY LIFE CYCLES DATABASE MAP ---
  const validationLifespanDatabase = {
    "compliance": "Tax Compliance Certificates (TCC) run for exactly 12 months from generation.",
    "good conduct": "DCI Police Clearance certificates are traditionally valid for 12 months.",
    "tims renewal": "NTSA driver license allocations require renewal loops every 1 or 3 years.",
    "business name": "Business Name Registrations hold reservation locks for 30 days before compilation.",
    "company reg": "CR12 company structure documents state continuous registry until share swaps happen."
  };

  // --- ACCIDENTAL DATA REFRESH PREVENTION LAYER ---
  window.addEventListener('beforeunload', (event) => {
    const bw = parseInt(document.getElementById('bwPages')?.value) || 0;
    const color = parseInt(document.getElementById('colorPages')?.value) || 0;
    const portal = parseInt(document.getElementById('portalFee')?.value) || 0;
    if (bw > 0 || color > 0 || portal > 0 || clickedItemsTotal > 0) {
      event.preventDefault();
      event.returnValue = 'You have a pending estimate invoice. Are you sure you want to leave?';
    }
  });

  // --- INTERACTIVE WEBAUDIO SYS CLICK SYNTHESIZER ---
  function playClick() {
    try {
      if (!globalAudioCtx) globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (globalAudioCtx.state === 'suspended') globalAudioCtx.resume();
      const osc = globalAudioCtx.createOscillator(); 
      const gainNode = globalAudioCtx.createGain();
      osc.type = 'triangle'; 
      osc.frequency.setValueAtTime(140, globalAudioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(700, globalAudioCtx.currentTime + 0.02);
      gainNode.gain.setValueAtTime(0.03, globalAudioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, globalAudioCtx.currentTime + 0.03);
      osc.connect(gainNode); 
      gainNode.connect(globalAudioCtx.destination);
      osc.start(); 
      osc.stop(globalAudioCtx.currentTime + 0.04);
    } catch (e) { console.log('Audio deferred.'); }
  }

  // --- INTERACTIVE SELECTION ITEM CLICK NODE TRACKER ---
  function toggleItemNode(element) {
    const value = parseInt(element.getAttribute('data-val')) || 0;
    if (element.classList.contains('active-node')) {
      element.classList.remove('active-node');
      clickedItemsTotal -= value;
    } else {
      element.classList.add('active-node');
      clickedItemsTotal += value;
    }
    
    const searchInput = document.getElementById('cyberSearch');
    if (searchInput && searchInput.value !== '') {
      searchInput.value = '';
      filterCyberNodes();
    }
    calculateTotal();
  }

  // --- WHOLE PAGE RECURSIVE REAL-TIME TYPEWRITER ENGINE ---
  function initializeWholePageTypewriterEngine() {
    const globalTypingSpeedMs = 6; 
    let elementsToAnimateArray = [];

    function recursivelyLocateTextNodes(currentNode) {
      const blacklistedTags = ['SCRIPT', 'STYLE', 'CANVAS', 'INPUT', 'SELECT', 'TEXTAREA', 'OPTION'];
      if (blacklistedTags.includes(currentNode.tagName)) return;
      if (currentNode.classList && currentNode.classList.contains('price-tag')) return;

      currentNode.childNodes.forEach(child => {
        if (child.nodeType === Node.TEXT_NODE && child.nodeValue.trim().length > 0) {
          elementsToAnimateArray.push({
            parent: currentNode,
            textNode: child,
            originalRawString: child.nodeValue
          });
          child.nodeValue = '';
        } else if (child.nodeType === Node.ELEMENT_NODE) {
          recursivelyLocateTextNodes(child);
        }
      });
    }

    const mainViewportWrapper = document.querySelector('.dashboard-envelope');
    if (!mainViewportWrapper) return;
    
    recursivelyLocateTextNodes(mainViewportWrapper);

    elementsToAnimateArray.forEach(item => {
      let currentCharacterPointer = 0;
      const fullStringTarget = item.originalRawString;
      
      function streamNextCharacter() {
        if (currentCharacterPointer <= fullStringTarget.length) {
          item.textNode.nodeValue = fullStringTarget.substring(0, currentCharacterPointer);
          currentCharacterPointer++;
          setTimeout(streamNextCharacter, globalTypingSpeedMs);
        }
      }
      streamNextCharacter();
    });
  }

  // --- QUICK MACRO BUNDLE PRESET ENGINE ---
  function injectBundlePresetNodes(targetServiceNames) {
    if (typeof playClick === 'function') playClick();
    const activeNodes = document.querySelectorAll('.active-node');
    activeNodes.forEach(node => node.classList.remove('active-node'));
    clickedItemsTotal = 0;

    const allItems = document.getElementsByClassName('item');
    for (let i = 0; i < allItems.length; i++) {
      let textContent = allItems[i].innerText.toLowerCase();
      const matchesPreset = targetServiceNames.some(targetName => textContent.includes(targetName.toLowerCase()));
      
      if (matchesPreset) {
        allItems[i].classList.add('active-node');
        const value = parseInt(allItems[i].getAttribute('data-val')) || 0;
        clickedItemsTotal += value;
      }
    }
    calculateTotal();
  }

  // --- GLOBAL ESTIMATE WIPE RESET MATRIX MODULE ---
  function wipeEntireSystemEstimates() {
    if (typeof playClick === 'function') playClick();
    
    if(document.getElementById('bwPages')) document.getElementById('bwPages').value = "0";
    if(document.getElementById('colorPages')) document.getElementById('colorPages').value = "0";
    if(document.getElementById('portalFee')) document.getElementById('portalFee').value = "0";
    if(document.getElementById('clientMetadataName')) document.getElementById('clientMetadataName').value = "";
    
    const activeNodes = document.querySelectorAll('.active-node');
    activeNodes.forEach(node => node.classList.remove('active-node'));
    
    clickedItemsTotal = 0;
    calculateTotal();
  }

  // --- MATH MATRIX ENGINE & DYNAMIC TIER SCALER ---
  function calculateTotal() {
    const bwCount = parseInt(document.getElementById('bwPages')?.value) || 0;
    const colorCount = parseInt(document.getElementById('colorPages')?.value) || 0;
    const portal = parseInt(document.getElementById('portalFee')?.value) || 0;
    const portalSelect = document.getElementById('portalFee');
    
    let bwPricePerPage = bwCount >= 50 ? 8 : 10;
    let colorPricePerPage = colorCount >= 30 ? 15 : 20;
    
    const grandTotal = (bwCount * bwPricePerPage) + (colorCount * colorPricePerPage) + portal + clickedItemsTotal;
    const grandTotalElem = document.getElementById('grandTotal');
    if (grandTotalElem) grandTotalElem.innerText = grandTotal.toLocaleString();
    
    const activeCount = document.querySelectorAll('.active-node').length;
    const nodeCounterElem = document.getElementById('nodeCounter');
    if (nodeCounterElem) nodeCounterElem.innerText = activeCount > 0 ? `[ ${activeCount} NODES ]` : '';
    
    // --- LIVE RECEIPT COMPILATION ENGINE ---
    let itemsList = [];
    document.querySelectorAll('.active-node').forEach(node => {
      let clone = node.cloneNode(true);
      let tag = clone.querySelector('.price-tag');
      if (tag) tag.remove();
      let cleanText = clone.innerText.replace(/>/g, '').trim();
      itemsList.push(cleanText);
    });
    
    if (bwCount > 0) itemsList.push(`${bwCount}x B&W Printing Pages (@ KES ${bwPricePerPage}/pg)`);
    if (colorCount > 0) itemsList.push(`${colorCount}x Color Printing Pages (@ KES ${colorPricePerPage}/pg)`);
    if (portal > 0 && portalSelect && portalSelect.selectedIndex >= 0) {
      itemsList.push(portalSelect.options[portalSelect.selectedIndex].text);
    }

    let message = `Hello Kenncom Digital, I want to process a transaction request:\n`;
    if (itemsList.length > 0) {
      message += `\n📋 SELECTED NODES:\n- ` + itemsList.join('\n- ') + `\n`;
    }
    message += `\n💰 TOTAL ESTIMATE: KES ${grandTotal}.`;
    
    const typingTextLogger = document.getElementById('typingText');
    if (typingTextLogger) {
      if (itemsList.length > 0) {
        typingTextLogger.innerHTML = `<strong>RECEIPT MATRIX COMPILED:</strong><br>` + itemsList.map(i => `> ${i}`).join('<br>') + `<br><span style="color:#fb923c; font-weight:bold; display:block; margin-top:5px;">TOTAL: KES ${grandTotal.toLocaleString()}</span>`;
      } else {
        typingTextLogger.innerHTML = `SYSTEM BOOT COMPLETE // INITIALIZING DIR NODES...<br>PWA LOCAL CACHE SYNCHRONIZED SUCCESFULLY.`;
      }
    }

    // --- STABLE LINK INJECTION MATRIX ROUTING CONFIG ---
    const baseWhatsAppUrl = "https://wa.me/254700000000"; // Replace with your WhatsApp phone number
    const linkElement = document.getElementById('secureCommsLink');
    if (linkElement) {
      linkElement.href = `${baseWhatsAppUrl}?text=${encodeURIComponent(message)}`;
    }
    
    const dynamicQrImageElement = document.getElementById('dynamicLiveMonitorQRCode');
    if (dynamicQrImageElement && linkElement) {
      dynamicQrImageElement.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(linkElement.href)}`;
    }

    if (typeof evaluateServiceProtocolsAndTime === 'function') evaluateServiceProtocolsAndTime();
    if (typeof processDocumentLifecycles === 'function') processDocumentLifecycles();
    if (typeof backupConfigurationStateToCache === 'function') backupConfigurationStateToCache();
  }

  // --- REQUIRES PROTOCOLS MATRIX EVALUATOR ---
  function evaluateServiceProtocolsAndTime() {
    const reqBox = document.getElementById('requirementsBox');
    const durationText = document.getElementById('estimatedDurationText');
    const listContainer = document.getElementById('checklistItemsList');
    if (!reqBox || !durationText || !listContainer) return;
    
    let computedTotalMinutes = 0;
    let consolidatedRequirementsSet = new Set();
    
    document.querySelectorAll('.active-node').forEach(node => {
      let cleanNodeText = node.innerText.toLowerCase();
      Object.keys(serviceProtocolDatabase).forEach(apiKey => {
        if (cleanNodeText.includes(apiKey)) {
          computedTotalMinutes += serviceProtocolDatabase[apiKey].time;
          serviceProtocolDatabase[apiKey].items.forEach(item => consolidatedRequirementsSet.add(item));
        }
      });
    });

    const bw = parseInt(document.getElementById('bwPages')?.value) || 0;
    const color = parseInt(document.getElementById('colorPages')?.value) || 0;
    if (bw > 0 || color > 0) {
      computedTotalMinutes += Math.ceil((bw + color) * 0.2);
      consolidatedRequirementsSet.add("Soft Copy Documents / Flash Drive Payloads");
    }
    
    if (computedTotalMinutes > 0) {
      reqBox.style.display = 'block';
      durationText.innerText = computedTotalMinutes >= 60 ? `${Math.floor(computedTotalMinutes / 60)}h ${computedTotalMinutes % 60}m EST` : `${computedTotalMinutes} MINS EST`;
      listContainer.innerHTML = '';
      consolidatedRequirementsSet.forEach(req => {
        listContainer.innerHTML += `<li style="margin-bottom:4px; color:#fff;">• <span style="color:#a78bfa;">${req}</span></li>`;
      });
    } else { reqBox.style.display = 'none'; }
  }

  // --- LIFE CYCLE REFRESH ALERTS INTERACTION ---
  function processDocumentLifecycles() {
    const infoBox = document.getElementById('expiryAndTokenBox');
    const listContainer = document.getElementById('expiryMetricsList');
    if (!infoBox || !listContainer) return;

    let lifecycleMatchesFound = 0; listContainer.innerHTML = '';
    document.querySelectorAll('.active-node').forEach(node => {
      let textCheck = node.innerText.toLowerCase();
      Object.keys(validationLifespanDatabase).forEach(key => {
        if (textCheck.includes(key)) {
          lifecycleMatchesFound++;
          listContainer.innerHTML += `<li style="margin-bottom:4px; color:#fff;">⚡ <span style="color:#e2e8f0;">${validationLifespanDatabase[key]}</span></li>`;
        }
      });
    });
    infoBox.style.display = lifecycleMatchesFound > 0 ? 'block' : 'none';
  }

  // --- SMART KEYWORDS SYNONYM DICTIONARY MAPPING LOOPS ---
  const smartSearchSynonymDictionary = {
    "tax": ["kra", "itax", "compliance", "pin", "etims", "invoice"],
    "pin": ["kra", "itax", "registration", "compliance"],
    "license": ["ntsa", "tims", "logbook", "transfer", "plate", "driving"],
    "car": ["ntsa", "tims", "logbook", "transfer", "plate", "vehicle"],
    "school": ["kuccps", "university", "assignment", "exam", "admission", "school", "helb"],
    "job": ["cv", "resume", "typesetting", "letter", "good conduct", "dci", "upwork", "fiverr", "linkedin"],
    "money": ["m-pesa", "withdrawal", "deposit", "finance", "bill", "tender", "crypto", "forex"]
  };

  function filterCyberNodes() {
    const searchElem = document.getElementById('cyberSearch');
    if (!searchElem) return;
    const input = searchElem.value.toLowerCase().trim();
    const cards = document.getElementsByClassName('cyber-card');
    const clearBtn = document.getElementById('clearSearchBtn');
    if (clearBtn) clearBtn.style.display = input !== '' ? 'block' : 'none';

    let targetedKeywordsList = [input];
    Object.keys(smartSearchSynonymDictionary).forEach(primaryKey => {
      if (input.includes(primaryKey) || primaryKey.includes(input)) {
        targetedKeywordsList = targetedKeywordsList.concat(smartSearchSynonymDictionary[primaryKey]);
      }
    });

    for (let i = 0; i < cards.length; i++) {
      const items = cards[i].getElementsByClassName('item'); 
      let cardMatches = false;
      for (let j = 0; j < items.length; j++) {
        let itemText = items[j].innerText.toLowerCase();
        let itemIsAMatch = (input === '') || targetedKeywordsList.some(kw => itemText.includes(kw));
        if (itemIsAMatch) { items[j].style.display = ""; if (input !== '') cardMatches = true; } 
        else { items[j].style.display = "none"; }
      }
      cards[i].style.display = (cardMatches || input === '') ? "" : "none";
    }
  }

  // --- LEISURE SESSION RUNTIME CLOCK COUNTDOWN ---
  function initializeLeisureCountdownTimer() {
    if (typeof playClick === 'function') playClick();
    if (activeSessionTimerIntervalId) clearInterval(activeSessionTimerIntervalId);

    const allocatedMinutes = parseInt(document.getElementById('sessionTimeDurationSelect')?.value) || 60;
    totalSecondsRemainingInSession = allocatedMinutes * 60;
    updateVisualSessionTimerDisplay();

    activeSessionTimerIntervalId = setInterval(() => {
      if (totalSecondsRemainingInSession > 0) {
        totalSecondsRemainingInSession--; 
        updateVisualSessionTimerDisplay();
        if (totalSecondsRemainingInSession === 120) triggerTerminalAudioWarningAlert();
      } else {
        terminateLeisureCountdownTimer();
        alert("TERMINAL NOTICE: Allocated leisure matrix block timeframe has elapsed.");
      }
    }, 1000);
  }

  function terminateLeisureCountdownTimer() {
    if (typeof playClick === 'function') playClick();
    if (activeSessionTimerIntervalId) { clearInterval(activeSessionTimerIntervalId); activeSessionTimerIntervalId = null; }
    totalSecondsRemainingInSession = 0;
    const displayElement = document.getElementById('sessionTimerDisplayClock');
    if (displayElement) {
      displayElement.innerText = "00:00:00";
      displayElement.style.color = "#fb923c";
    }
  }

  function updateVisualSessionTimerDisplay() {
    const displayElement = document.getElementById('sessionTimerDisplayClock'); if (!displayElement) return;
    const hrs = Math.floor(totalSecondsRemainingInSession / 3600);
    const mins = Math.floor((totalSecondsRemainingInSession % 3600) / 60);
    const secs = totalSecondsRemainingInSession % 60;
    displayElement.innerText = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    displayElement.style.color = totalSecondsRemainingInSession <= 120 ? "#ef4444" : (totalSecondsRemainingInSession <= 300 ? "#fb923c" : "#22d3ee");
  }

  function triggerTerminalAudioWarningAlert() {
    try {
      if (globalAudioCtx) {
        const osc = globalAudioCtx.createOscillator(); 
        const gainNode = globalAudioCtx.createGain();
        osc.type = 'sawtooth'; 
        osc.frequency.setValueAtTime(880, globalAudioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.05, globalAudioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, globalAudioCtx.currentTime + 0.3);
        osc.connect(gainNode); 
        gainNode.connect(globalAudioCtx.destination);
        osc.start(); 
        osc.stop(globalAudioCtx.currentTime + 0.3);
      }
    } catch (e) { console.log("Warning audio fault."); }
  }

  // --- FORM ENTRY PAYLOAD INPUT DATA SANITIZER ---
  function sanitizeDataPayload(mode) {
    if (typeof playClick === 'function') playClick();
    const inputElement = document.getElementById('rawSanitizerInput'); if (!inputElement) return;
    let currentText = inputElement.value;

    if (mode === 'uppercase') { currentText = currentText.toUpperCase().replace(/\s+/g, ' ').trim(); } 
    else if (mode === 'phone') {
      let nums = currentText.replace(/\D/g, '');
      if (nums.startsWith('254') && nums.length === 12) nums = '0' + nums.substring(3);
      else if ((nums.startsWith('7') || nums.startsWith('1')) && nums.length === 9) nums = '0' + nums;
      currentText = nums;
    } 
    else if (mode === 'clean-text') { currentText = currentText.replace(/[^\w\s-]/gi, '').replace(/\s+/g, ' ').trim(); }
    inputElement.value = currentText;
  }

  function copySanitizedPayloadToClipboard() {
    if (typeof playClick === 'function') playClick();
    const input = document.getElementById('rawSanitizerInput');
    if (!input || !input.value.trim()) { alert("TERMINAL ERROR: Sanitizer field array is currently empty."); return; }
    navigator.clipboard.writeText(input.value).then(() => alert("SUCCESS // Cleaned string copied to system clipboard matrix.")).catch(() => alert("FAULT: Clipboard hardware access drop."));
  }

  // --- SYSTEM DYNAMIC THEMES & ACCESSIBILITY TEXT FLUID FONTS CYCLER ---
  function toggleSystemUIVisualTheme() {
    if (typeof playClick === 'function') playClick();
    const styleRoot = document.documentElement;
    if (currentActiveColorState === "cyberpunk") {
      styleRoot.style.setProperty('--cyber-glow-primary', '#34d399'); 
      styleRoot.style.setProperty('--cyber-glow-secondary', '#10b981'); 
      styleRoot.style.setProperty('--cyber-text-accent', '#34d399');
      currentActiveColorState = "classic-matrix";
    } else {
      styleRoot.style.setProperty('--cyber-glow-primary', '#f472b6'); 
      styleRoot.style.setProperty('--cyber-glow-secondary', '#22d3ee'); 
      styleRoot.style.setProperty('--cyber-text-accent', '#a78bfa');
      currentActiveColorState = "cyberpunk";
    }
  }

  function cycleAccessibilityTextScale() {
    if (typeof playClick === 'function') playClick();
    currentScaleStepIndex = (currentScaleStepIndex + 1) % fontScaleStepsMap.length;
    const config = fontScaleStepsMap[currentScaleStepIndex];
    const scaleIndicator = document.getElementById('textScaleIndicatorNode');
    if (scaleIndicator) scaleIndicator.innerText = config.label;
    
    const items = document.getElementsByClassName('item'); 
    for (let i = 0; i < items.length; i++) items[i].style.fontSize = config.bodySize;
    
    const titles = document.getElementsByClassName('card-title'); 
    for (let i = 0; i < titles.length; i++) titles[i].style.fontSize = config.cardTitle;
    
    const lists = document.getElementsByClassName('two-col-list'); 
    for (let i = 0; i < lists.length; i++) lists[i].style.gap = config.rowGap;
  }

  // --- LOCAL DEPLOYMENT CACHE WRITERS ---
  function backupConfigurationStateToCache() {
    let checkedNodeIndexes = []; 
    const items = document.getElementsByClassName('item');
    for (let i = 0; i < items.length; i++) if (items[i].classList.contains('active-node')) checkedNodeIndexes.push(i);
    const payload = {
      bw: document.getElementById('bwPages')?.value || "0", 
      color: document.getElementById('colorPages')?.value || "0", 
      portal: document.getElementById('portalFee')?.value || "0", 
      name: document.getElementById('clientMetadataName')?.value || "", 
      nodes: checkedNodeIndexes
    };
    localStorage.setItem('kenncom_terminal_state', JSON.stringify(payload));
  }

  function recoverConfigurationStateFromCache() {
    const data = localStorage.getItem('kenncom_terminal_state'); if (!data) return;
    try {
      const payload = JSON.parse(data);
      if (payload.bw && document.getElementById('bwPages')) document.getElementById('bwPages').value = payload.bw;
      if (payload.color && document.getElementById('colorPages')) document.getElementById('colorPages').value = payload.color;
      if (payload.portal && document.getElementById('portalFee')) document.getElementById('portalFee').value = payload.portal;
      if (payload.name && document.getElementById('clientMetadataName')) document.getElementById('clientMetadataName').value = payload.name;
      if (payload.nodes) {
        const items = document.getElementsByClassName('item'); clickedItemsTotal = 0;
        payload.nodes.forEach(idx => { 
          if (items[idx]) { 
            items[idx].classList.add('active-node'); 
            clickedItemsTotal += parseInt(items[idx].getAttribute('data-val')) || 0; 
          } 
        });
      }
      calculateTotal();
    } catch (e) { console.log("Cache read skipped."); }
  }

  function executeClipboardTokenSnapshotCopy() {
    if (typeof playClick === 'function') playClick();
    const sumElem = document.getElementById('grandTotal');
    const sum = sumElem ? sumElem.innerText : "0"; 
    let shortItems = [];
    
    document.querySelectorAll('.active-node').forEach(node => { 
      let clone = node.cloneNode(true);
      let tag = clone.querySelector('.price-tag');
      if (tag) tag.remove();
      shortItems.push(clone.innerText.replace(/>/g, '').trim());
    });
    
    const bwVal = parseInt(document.getElementById('bwPages')?.value) || 0;
    const colorVal = parseInt(document.getElementById('colorPages')?.value) || 0;

    if (shortItems.length === 0 && bwVal === 0 && colorVal === 0) { 
      alert("TERMINAL ERROR: Select a directory node or enter pages first."); 
      return; 
    }
    let token = `KENNCOM REF // Items: ${shortItems.slice(0, 3).join(', ')}${shortItems.length > 3 ? '...' : ''} | Total Valuation: KES ${sum}.`;
    navigator.clipboard.writeText(token).then(() => alert("SUCCESS // Reference code token profile copied.")).catch(() => alert("HARDWARE FAULT."));
  }

  // --- TERMINAL LATENCY DIAGNOSTIC MODULE ---
  function triggerNetworkDiagnosticPing() {
    if (typeof playClick === 'function') playClick();
    const pingText = document.getElementById('pingStatusText'); 
    const progressBar = document.getElementById('pingProgressBar');
    if (!pingText || !progressBar) return;
    
    pingText.innerText = "PINGING MATRIX NODE..."; 
    pingText.style.color = "#fb923c"; 
    progressBar.style.width = "20%";
    
    setTimeout(() => {
      progressBar.style.width = "60%";
      setTimeout(() => { 
        progressBar.style.width = "100%"; 
        pingText.innerText = "CONNECTED // 12ms LATENCY"; 
        pingText.style.color = "#34d399"; 
      }, 400);
    }, 300);
  }

  function forceResetSearch() { 
    const searchInput = document.getElementById('cyberSearch'); 
    if (searchInput) { searchInput.value = ''; filterCyberNodes(); } 
  }

  // --- MATRIX DIGITAL RAIN EFFECTS ACCELERATOR ENGINE ---
  function initMatrixBackgroundEngine() {
    const canvas = document.getElementById('matrixCanvas'); if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() { 
      canvas.width = window.innerWidth; 
      canvas.height = window.innerHeight; 
    }
    resizeCanvas(); 
    window.addEventListener('resize', resizeCanvas);
    
    const alphabet = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZMODULESYSTEMCORE"; 
    const fontSize = 14; 
    const columns = Math.floor((canvas.width || window.innerWidth) / fontSize); 
    const rainDrops = Array(columns).fill(1);
    
    function drawMatrixFrame() {
      ctx.fillStyle = 'rgba(8, 8, 10, 0.05)'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = currentActiveColorState === "cyberpunk" ? '#f472b6' : '#34d399'; 
      ctx.font = fontSize + 'px monospace';
      
      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length)); 
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
        rainDrops[i]++;
      }
    }
    setInterval(drawMatrixFrame, 33);
  }

  // --- LIFE CYCLE INITIALIZER APP LINK SYSTEM CORES ---
  window.addEventListener('DOMContentLoaded', () => {
    initMatrixBackgroundEngine();
    recoverConfigurationStateFromCache();
    calculateTotal();
    
    // LAUNCH MASTER AUTO-TYPER ENGINE
    initializeWholePageTypewriterEngine();
    
    const statusBadge = document.getElementById('statusBadge'); 
    if (statusBadge) statusBadge.innerText = "SYSTEM ACTIVE // RUNTIME SECURE";
    
    window.addEventListener('offline', () => { 
      const alertBanner = document.getElementById('offlineHardwareBannerAlert'); 
      if (alertBanner) alertBanner.style.display = 'block'; 
    });
    
    window.addEventListener('online', () => { 
      const alertBanner = document.getElementById('offlineHardwareBannerAlert'); 
      if (alertBanner) alertBanner.style.display = 'none'; 
    });
    
    if (!navigator.onLine) { 
      const alertBanner = document.getElementById('offlineHardwareBannerAlert'); 
      if (alertBanner) alertBanner.style.display = 'block'; 
    }
  });
</script>
