<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal & File Upload</title>
  
  <!-- Required Libraries for In-Browser File Conversions -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2, h3 { color: #1a1a1a; margin-top: 0; }
    label { font-size: 0.85rem; font-weight: 600; color: #444; display: block; margin-top: 12px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    .btn-wa { background-color: #25D366; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-upload { background-color: #0066cc; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
    button:disabled { background-color: #a0a0a0; cursor: not-allowed; }
    
    .divider { text-align: center; margin: 20px 0; border-bottom: 1px solid #eee; line-height: 0.1em; }
    .divider span { background:#fff; padding:0 10px; color: #777; font-size: 0.85rem; }

    .section-box { background: #f8f9fa; border: 1px dashed #bbb; padding: 15px; border-radius: 8px; margin-top: 15px; }
    .status-msg { margin-top: 12px; font-size: 0.9rem; color: #0066cc; font-weight: 600; word-break: break-all; }
  </style>
</head>
<body>

<div class="container">
  <h2>Customer Portal</h2>
  
  <label for="custName">Full Name:</label>
  <input type="text" id="custName" placeholder="Enter full name">

  <label for="custPhone">Phone Number:</label>
  <input type="tel" id="custPhone" placeholder="e.g. +254712345678">

  <button class="btn-wa" onclick="sendWhatsApp()">Continue with WhatsApp</button>

  <div class="divider"><span>DON'T HAVE WHATSAPP?</span></div>

  <!-- Document Portal & Direct Drive Upload -->
  <div class="section-box">
    <h3>Upload & Convert Document</h3>
    <p style="font-size: 0.8rem; color: #666;">Convert your file if needed, then upload it directly to our Google Drive folder.</p>
    
    <label for="fileInput">Select File (PDF, DOCX, JPG, PNG, TXT):</label>
    <input type="file" id="fileInput" accept=".pdf,.docx,.jpg,.jpeg,.png,.txt">

    <label for="convertTarget">Action / Target Format:</label>
    <select id="convertTarget">
      <option value="direct">Upload As-Is (No Conversion)</option>
      <option value="pdf">Convert Image to PDF & Upload</option>
      <option value="txt">Extract to Text & Upload</option>
    </select>

    <button class="btn-upload" id="uploadBtn" onclick="handleFileProcessing()">Process & Upload to Drive</button>
    <div id="status" class="status-msg"></div>
  </div>
</div>

<script>
  // YOUR LIVE GOOGLE APPS SCRIPT WEB APP URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTIBA2wSvQsbQyG3G6IEhUbzmOSW9-HcWrdIhR8Jf_JNRi7Oj6yH1Gn25Qk7-5jP5uSg/exec";
  
  // Replace with your business WhatsApp phone number (include country code without +)
  const BUSINESS_PHONE = "254700000000"; 

  // Restore saved customer info on page load
  window.onload = function() {
    if (localStorage.getItem('savedName')) document.getElementById('custName').value = localStorage.getItem('savedName');
    if (localStorage.getItem('savedPhone')) document.getElementById('custPhone').value = localStorage.getItem('savedPhone');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  };

  function getAndSaveUser() {
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();

    if (!name || !phone) {
      alert("Please enter both your Name and Phone Number.");
      return null;
    }

    localStorage.setItem('savedName', name);
    localStorage.setItem('savedPhone', phone);
    return { name, phone };
  }

  function sendWhatsApp() {
    const user = getAndSaveUser();
    if (!user) return;

    const msg = `Hello, my name is ${user.name} (${user.phone}). I would like to send a document.`;
    window.location.href = `https://wa.me/${BUSINESS_PHONE}?text=${encodeURIComponent(msg)}`;
  }

  // Core Function: Uploads Blob/File to Google Drive Apps Script
  async function uploadToGoogleDrive(fileBlob, fileName, mimeType) {
    const user = getAndSaveUser();
    if (!user) return;

    const status = document.getElementById('status');
    const uploadBtn = document.getElementById('uploadBtn');
    
    status.innerText = "Uploading directly to Google Drive...";
    uploadBtn.disabled = true;

    const reader = new FileReader();
    reader.readAsDataURL(fileBlob);
    reader.onloadend = async function () {
      const base64Data = reader.result.split(',')[1];

      const payload = {
        customerName: user.name,
        customerPhone: user.phone,
        fileName: fileName,
        mimeType: mimeType,
        fileData: base64Data
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === 'success') {
          status.innerText = "✅ Upload complete! File saved in Google Drive.";
        } else {
          status.innerText = "❌ Upload failed: " + result.message;
        }
      } catch (err) {
        console.error(err);
        status.innerText = "❌ Upload error. Please check network connection.";
      } finally {
        uploadBtn.disabled = false;
      }
    };
  }

  // Conversion & File Processing Routing
  async function handleFileProcessing() {
    const user = getAndSaveUser();
    if (!user) return;

    const fileInput = document.getElementById('fileInput');
    const action = document.getElementById('convertTarget').value;
    const status = document.getElementById('status');

    if (fileInput.files.length === 0) {
      alert("Please select a file first.");
      return;
    }

    const file = fileInput.files[0];
    const fileExt = file.name.split('.').pop().toLowerCase();
    status.innerText = "Processing file...";

    try {
      // 1. Direct Upload without Conversion
      if (action === 'direct') {
        uploadToGoogleDrive(file, file.name, file.type || 'application/octet-stream');
      } 
      // 2. Image -> PDF Conversion + Upload
      else if (action === 'pdf' && ['jpg', 'jpeg', 'png', 'webp'].includes(fileExt)) {
        const { jsPDF } = window.jspdf;
        const reader = new FileReader();
        reader.onload = function (e) {
          const doc = new jsPDF();
          doc.addImage(e.target.result, 'JPEG', 10, 10, 180, 160);
          const pdfBlob = doc.output('blob');
          uploadToGoogleDrive(pdfBlob, `${file.name.split('.')[0]}_converted.pdf`, 'application/pdf');
        };
        reader.readAsDataURL(file);
      }
      // 3. Word (.docx) -> Text Extraction + Upload
      else if (action === 'txt' && fileExt === 'docx') {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
        const txtBlob = new Blob([result.value], { type: 'text/plain' });
        uploadToGoogleDrive(txtBlob, `${file.name.split('.')[0]}_extracted.txt`, 'text/plain');
      }
      // 4. PDF -> Text Extraction + Upload
      else if (action === 'txt' && fileExt === 'pdf') {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let extractedText = "";

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          extractedText += textContent.items.map(item => item.str).join(" ") + "\n";
        }
        const txtBlob = new Blob([extractedText], { type: 'text/plain' });
        uploadToGoogleDrive(txtBlob, `${file.name.split('.')[0]}_extracted.txt`, 'text/plain');
      } 
      else {
        // Fallback to direct upload if selected action doesn't match input file format
        uploadToGoogleDrive(file, file.name, file.type || 'application/octet-stream');
      }
    } catch (err) {
      console.error(err);
      status.innerText = "Error processing file. Attempting direct upload instead...";
      uploadToGoogleDrive(file, file.name, file.type || 'application/octet-stream');
    }
  }
</script>

</body>
</html>
